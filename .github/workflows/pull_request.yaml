name: Pull Request

on: pull_request

jobs:
  pre-push:
    strategy:
      matrix:
        toolchain:
          - stable
          - 1.92
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@${{ matrix.toolchain }}
      - run: rustc --version
      - run: make pre-push